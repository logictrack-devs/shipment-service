spring:
  application:
    name: shipment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/logitrack_shipment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:shipment_user}
    password: ${DB_PASSWORD:shipment_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/public.pem

server:
  port: ${SERVER_PORT:8081}

courier:
  service:
    url: ${COURIER_SERVICE_URL:http://localhost:8082}