spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shipment_service?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

